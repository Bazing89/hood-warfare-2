  <!-- Karen Warfare ESC Pause Menu -->
  <div id="karen-pause-menu" style="display: none; position: fixed; inset: 0; background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(8px); z-index: 9999999; align-items: center; justify-content: center; font-family: 'Montserrat', system-ui, sans-serif;">

      <div style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #ff80ab; margin-bottom: 6px;">GAME PAUSED</div>
      <h2 style="font-size: 24px; font-weight: 900; letter-spacing: 3px; color: #ffffff; margin: 0 0 18px;">KAREN WARFARE</h2>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button id="karen-btn-resume" style="background: linear-gradient(90deg, #c2185b, #e91e63); color: #fff; border: none; padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; cursor: pointer; transition: all 0.2s;">
          ▶ RESUME COMBAT (ESC)
        </button>
        <a href="/" style="background: linear-gradient(90deg, #1868ff, #0044ff); color: #fff; text-decoration: none; padding: 14px; border-radius: 6px; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;">
          <span>←</span> <span>🏠 RETURN TO MAIN MENU</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pauseMenu = document.getElementById('karen-pause-menu');
      const btnResume = document.getElementById('karen-btn-resume');

      function toggleKarenPause() {
        if (!pauseMenu) return;
        const isOpen = pauseMenu.style.display === 'flex';
        if (isOpen) {
          pauseMenu.style.display = 'none';
          const canvas = document.querySelector('canvas') || document.body;
          if (canvas && canvas.requestPointerLock) canvas.requestPointerLock();
        } else {
          pauseMenu.style.display = 'flex';
          if (document.exitPointerLock) document.exitPointerLock();
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape') {
          e.preventDefault();
          toggleKarenPause();
        }
      });

      if (btnResume) {
        btnResume.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleKarenPause();
        });
      }

      document.addEventListener('pointerlockchange', () => {
        if (!document.pointerLockElement) {
          if (window.__fps && window.__fps.ready) {
            if (pauseMenu) pauseMenu.style.display = 'flex';
          }
        }
      });
    });
  </script>
  <script>
    // Splash: removed instantly under automation (harness screenshots must never catch it), and as a
    // fallback when no UI module dismisses it (?only=core).
    (function wait() {
      var b = document.getElementById('boot');
      if (!b) return;
      if (window.__fps && window.__fps.ready) {
        if (navigator.webdriver) { b.remove(); return; }
        setTimeout(function () { if (!document.getElementById('ui')) { var x = document.getElementById('boot'); if (x) x.remove(); } }, 1500);
        return;
      }
      setTimeout(wait, 50);
    })();
  </script>
